<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rediger Buddy Premium</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#14213a;font-family:Inter,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.head{background:linear-gradient(135deg,#071a37,#123f78);color:#fff;border-radius:26px;padding:28px;box-shadow:0 16px 40px #10284b30;border-bottom:4px solid #e4b344}.head small{color:#f3cb6d;font-weight:900;letter-spacing:1.5px}.card{background:#fff;border:1px solid #e3e9f1;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 8px 24px #10284b0c}label{display:block;font-weight:800;margin:17px 0 7px}input,textarea,select{width:100%;padding:13px 14px;border:1px solid #ccd7e5;border-radius:13px;font:inherit}textarea{min-height:130px;resize:vertical}.preview{width:130px;height:130px;object-fit:cover;border-radius:20px;border:2px solid #e4b344;background:#f5f6f8}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.imgbox{position:relative}.imgbox img{width:100%;height:150px;object-fit:cover;border-radius:15px}.del{position:absolute;right:7px;top:7px;border:0;background:#9f1f2f;color:#fff;padding:7px 9px;border-radius:9px;cursor:pointer}.save{width:100%;border:0;border-radius:15px;padding:16px;margin-top:22px;background:linear-gradient(135deg,#f7d97d,#dfa52b);color:#332000;font-weight:900;font-size:17px;cursor:pointer}.back{display:inline-flex;margin-top:14px;color:#fff;text-decoration:none;font-weight:800}.status{padding:14px;border-radius:13px;background:#eef4fb;margin-top:16px;font-weight:700}.deny{background:#fff1f2;color:#9f1239}@media(max-width:650px){.wrap{padding:10px}.gallery{grid-template-columns:1fr 1fr}}</style>
<style>
:root{--bg:#031721;--panel:#082a39;--panel2:#071f2b;--line:#18576c;--teal:#18a9b9;--text:#f2fdff;--muted:#a9ccd7;--gold:#e4b95d}
body{background:radial-gradient(circle at 80% 8%,#123c55 0,#061f2c 34%,#031721 100%)!important;color:var(--text)!important}
.wrap,.container{max-width:1000px!important}
header,.head,.card,.panel,section{background:linear-gradient(180deg,#092a39,#071f2b)!important;border-color:#164f64!important;color:#f2fdff!important;box-shadow:0 18px 40px rgba(0,0,0,.20)!important}
h1,h2,h3,label{color:#f2fdff!important}
p,.help,.muted,.hint{color:#a9ccd7!important}
input,textarea,select{background:#061f2c!important;color:#f2fdff!important;border:1px solid #287b91!important}
input:focus,textarea:focus,select:focus{outline:2px solid #18a9b9!important}
button,.btn{background:linear-gradient(135deg,#0d718f,#18a9b9)!important;color:#fff!important;border:0!important}
.preview,.thumb{background:#0a3040!important;border-color:#287b91!important}
.badge{background:linear-gradient(135deg,#d7ad58,#f0c977)!important;color:#211707!important}
</style>
</head><body><main class="wrap"><header class="head"><small>BUDDY RAGLAMYR • PREMIUM</small><h1>Rediger Premium-profil</h1><p>Her kan butikken endre innhold og bilder uten å bruke kode.</p><a id="back" class="back">← Se Premium-profilen</a></header><div id="status" class="status">Kontrollerer tilgang …</div><section id="editor" class="card" style="display:none"><label>Logo</label><img id="logoPreview" class="preview"><input id="logoInput" type="file" accept="image/*"><label>Butikknavn</label><input id="name"><label>Beskrivelse</label><textarea id="description"></textarea><label>Adresse</label><input id="address"><label>Telefon</label><input id="phone"><label>Nettside / Facebook</label><input id="website"><label>Video / Reel</label><input id="reel"><label>Bilder fra butikken</label><input id="galleryInput" type="file" multiple accept="image/*"><div id="gallery" class="gallery"></div><button class="save" onclick="saveShop()">💾 Lagre Premium-profil</button></section></main><script>
const sb=window.supabase.createClient('https://kxudiviidwwwclbzgdyx.supabase.co','sb_publishable_EaSgrgWqXKnaRRRkKparWA_ZmmRG8QH');
const ID='5e2383a8-6664-481b-ba17-409909bf5d57', DEMO_CODE='BUDDY2026';
const code=new URLSearchParams(location.search).get('edit')||'';
let shop={},galleryUrls=[];
const $=id=>document.getElementById(id);
const statusEl=$('status'),editorEl=$('editor'),backEl=$('back'),nameEl=$('name'),descriptionEl=$('description'),addressEl=$('address'),phoneEl=$('phone'),websiteEl=$('website'),reelEl=$('reel'),logoPreviewEl=$('logoPreview'),logoInputEl=$('logoInput'),galleryInputEl=$('galleryInput'),galleryEl=$('gallery');
backEl.href='buddy-haugesund-premium.html?edit='+encodeURIComponent(code);
function msg(t,bad=false){statusEl.textContent=t;statusEl.className='status'+(bad?' deny':'');statusEl.style.display='block'}
async function load(){
 if(code!==DEMO_CODE){msg('Denne redigeringslenken er ikke gyldig.',true);return}
 const {data,error}=await sb.from('businesses').select('*').eq('id',ID).single();
 if(error||!data){msg('Kunne ikke laste butikken: '+(error?.message||'ukjent feil'),true);return}
 shop=data;nameEl.value=data.name||'';descriptionEl.value=data.description||data.text||'';addressEl.value=data.address||data.place||'';phoneEl.value=data.phone||'';websiteEl.value=data.website||'';reelEl.value=data.reel_url||data.reel||'';logoPreviewEl.src=data.logo_url||data.logo||'';
 galleryUrls=data.gallery_urls||data.gallery||[];try{if(typeof galleryUrls==='string')galleryUrls=JSON.parse(galleryUrls)}catch(e){galleryUrls=[]}if(!Array.isArray(galleryUrls))galleryUrls=[];
 render();editorEl.style.display='block';msg('✅ Klar for redigering');
}
function render(){galleryEl.innerHTML='';galleryUrls.forEach((u,i)=>{const b=document.createElement('div');b.className='imgbox';const im=document.createElement('img');im.src=u;const bt=document.createElement('button');bt.className='del';bt.type='button';bt.textContent='Slett';bt.onclick=()=>{galleryUrls.splice(i,1);render()};b.append(im,bt);galleryEl.appendChild(b)})}
async function upload(file,path){const safe=(file.name||'bilde').replace(/[^a-zA-Z0-9._-]/g,'-');const key=path+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'-'+safe;const r=await sb.storage.from('story-images').upload(key,file,{upsert:false});if(r.error){msg('Bildeopplasting feilet: '+r.error.message,true);return null}return sb.storage.from('story-images').getPublicUrl(key).data.publicUrl}
logoInputEl.onchange=async e=>{const f=e.target.files[0];if(!f)return;msg('Laster opp logo …');const u=await upload(f,'logos');if(u){shop.logo_url=u;logoPreviewEl.src=u;msg('✅ Logo lastet opp – trykk Lagre')}};
galleryInputEl.onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;msg('Laster opp bilder …');for(const f of fs){const u=await upload(f,'gallery');if(u)galleryUrls.push(u)}render();msg('✅ Bilder lastet opp – trykk Lagre')};
async function saveShop(){
 msg('Lagrer …');
 const patch={name:nameEl.value.trim(),description:descriptionEl.value.trim(),address:addressEl.value.trim(),phone:phoneEl.value.trim(),website:websiteEl.value.trim(),reel_url:reelEl.value.trim(),logo_url:shop.logo_url||'',gallery_urls:galleryUrls};
 const {data,error}=await sb.from('businesses').update(patch).eq('id',ID).select();
 if(error){msg('❌ Kunne ikke lagre: '+error.message,true);return}
 if(!data||!data.length){msg('❌ Supabase avviste lagringen. Ingen data ble endret.',true);return}
 shop={...shop,...patch};msg('✅ Premium-profilen er lagret.');
}
const saveBtn=document.querySelector('button.save');saveBtn.removeAttribute('onclick');saveBtn.type='button';saveBtn.addEventListener('click',saveShop);
load();
</script></body></html>
