<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rediger Buddy Premium</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#14213a;font-family:Inter,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.head{background:linear-gradient(135deg,#071a37,#123f78);color:#fff;border-radius:26px;padding:28px;box-shadow:0 16px 40px #10284b30;border-bottom:4px solid #e4b344}.head small{color:#f3cb6d;font-weight:900;letter-spacing:1.5px}.card{background:#fff;border:1px solid #e3e9f1;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 8px 24px #10284b0c}label{display:block;font-weight:800;margin:17px 0 7px}input,textarea,select{width:100%;padding:13px 14px;border:1px solid #ccd7e5;border-radius:13px;font:inherit}textarea{min-height:130px;resize:vertical}.preview{width:130px;height:130px;object-fit:cover;border-radius:20px;border:2px solid #e4b344;background:#f5f6f8}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.imgbox{position:relative}.imgbox img{width:100%;height:150px;object-fit:cover;border-radius:15px}.del{position:absolute;right:7px;top:7px;border:0;background:#9f1f2f;color:#fff;padding:7px 9px;border-radius:9px;cursor:pointer}.save{width:100%;border:0;border-radius:15px;padding:16px;margin-top:22px;background:linear-gradient(135deg,#f7d97d,#dfa52b);color:#332000;font-weight:900;font-size:17px;cursor:pointer}.back{display:inline-flex;margin-top:14px;color:#fff;text-decoration:none;font-weight:800}.status{padding:14px;border-radius:13px;background:#eef4fb;margin-top:16px;font-weight:700}.deny{background:#fff1f2;color:#9f1239}@media(max-width:650px){.wrap{padding:10px}.gallery{grid-template-columns:1fr 1fr}}</style>

</head><body><main class="wrap"><header class="head"><small>BUDDY RAGLAMYR • PREMIUM</small><h1>Rediger Premium-profil</h1><p>Her kan butikken endre innhold og bilder uten å bruke kode.</p><a id="back" class="back">← Se Premium-profilen</a></header><div id="status" class="status">Kontrollerer tilgang …</div><section id="editor" class="card" style="display:none"><label>Logo</label><img id="logoPreview" class="preview"><input id="logoInput" type="file" accept="image/*"><label>Butikknavn</label><input id="name"><label>Beskrivelse</label><textarea id="description"></textarea><label>Adresse</label><input id="address"><label>Telefon</label><input id="phone"><label>Nettside / Facebook</label><input id="website"><label>Video / Reel</label><input id="reel"><label>Bilder fra butikken</label><input id="galleryInput" type="file" multiple accept="image/*"><div id="gallery" class="gallery"></div><button class="save" onclick="saveShop()">💾 Lagre Premium-profil</button></section></main><script>
const sb=window.supabase.createClient('https://kxudiviidwwwclbzgdyx.supabase.co','sb_publishable_EaSgrgWqXKnaRRRkKparWA_ZmmRG8QH');const ID='5e2383a8-6664-481b-ba17-409909bf5d57';const code=new URLSearchParams(location.search).get('edit')||'';const DEMO_CODE='BUDDY2026';let shop={},galleryUrls=[];back.href='buddy-haugesund-premium.html?edit='+encodeURIComponent(code);function msg(t,bad=false){status.textContent=t;status.className='status'+(bad?' deny':'')}async function load(){const {data,error}=await sb.from('businesses').select('*').eq('id',ID).single();if(error||!data){msg('Kunne ikke laste butikken.',true);return}if(code!==DEMO_CODE){msg('Denne redigeringslenken er ikke gyldig. Åpne den private Premium-redigeringslenken.',true);return}shop=data;name.value=data.name||'';description.value=data.description||'';address.value=data.address||data.place||'';phone.value=data.phone||'';website.value=data.website||'';reel.value=data.reel_url||'';logoPreview.src=data.logo_url||'';galleryUrls=data.gallery_urls||[];try{if(typeof galleryUrls==='string')galleryUrls=JSON.parse(galleryUrls)}catch(e){galleryUrls=[]}render();editor.style.display='block';msg('✅ Klar for redigering')}function render(){gallery.innerHTML=galleryUrls.map((u,i)=>`<div class="imgbox"><img src="${u}"><button class="del" type="button" onclick="removeImg(${i})">Slett</button></div>`).join('')}function removeImg(i){galleryUrls.splice(i,1);render()}async function upload(file,path){const safe=(file.name||'bilde').replace(/[^a-zA-Z0-9._-]/g,'-');const key=path+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'-'+safe;let r=await sb.storage.from('story-images').upload(key,file,{upsert:false});if(r.error){console.error(r.error);msg('Bildeopplasting feilet: '+r.error.message,true);return null}return sb.storage.from('story-images').getPublicUrl(key).data.publicUrl}logoInput.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;msg('Laster opp logo …');const u=await upload(f,'logos');if(u){shop.logo_url=u;logoPreview.src=u;msg('✅ Logo lastet opp')}});galleryInput.addEventListener('change',async e=>{const fs=[...e.target.files];if(!fs.length)return;msg('Laster opp bilder …');for(const f of fs){const u=await upload(f,'gallery');if(u)galleryUrls.push(u)}render();msg('✅ Bilder lastet opp')});async function saveShop(){if(code!==DEMO_CODE){msg('Ugyldig redigeringstilgang.',true);return}msg('Lagrer …');const patch={name:name.value.trim(),description:description.value.trim(),address:address.value.trim(),phone:phone.value.trim(),website:website.value.trim(),reel_url:reel.value.trim(),logo_url:shop.logo_url||'',gallery_urls:galleryUrls};const {error}=await sb.from('businesses').update(patch).eq('id',ID);if(error){console.error(error);msg('Kunne ikke lagre: '+error.message,true);return}msg('✅ Premium-profilen er lagret. Endringene er synlige med en gang.')}load();</script></body></html>
