<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bjeffeknapp</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bjeffeknapp">
<meta name="theme-color" content="#176b58"><style>body{font-family:Arial;background:#f4f7f6;color:#17352e}.w{max-width:580px;margin:auto;padding:20px}.c{background:#fff;padding:22px;border-radius:20px}button{width:100%;padding:17px;margin:7px 0;border:0;border-radius:14px;background:#176b58;color:white;font-size:18px;font-weight:bold}.stop{background:#c72b2b}.n{background:#fff3cd;padding:13px;border-radius:12px}</style></head><body><div class="w"><div class="c"><h1>🐾 Bjeffeknapp</h1><h2 style='text-align:center'>Hundene Våre</h2><div class="n">Start med 18 kHz. Trykk bare kort og observer hunden. Ikke hold telefonen nær ørene.</div><button style="font-size:27px;padding:28px;background:#c72b2b" onclick="sweep()">🐕<br>BJEFFESTOPP</button><hr><p><b>Testlyder:</b></p><button onclick="tone(18000)">🔊 18 kHz</button><button onclick="tone(19000)">🔊 19 kHz</button><button onclick="tone(19500)">🔊 19,5 kHz</button><button onclick="tone(20000)">🔊 20 kHz</button><button onclick="sweep()">〰️ 18–20 kHz PULS/SVEIP</button><button class="stop" onclick="stop()">■ STOPP</button><p style="text-align:center"><b>www.hundenevåre.com</b></p></div></div><script>let c,o,g,t;function stop(){if(t)clearInterval(t);t=null;try{o&&o.stop()}catch(e){}o=null;if(c){c.close();c=null}}function base(){stop();c=new(window.AudioContext||window.webkitAudioContext)();o=c.createOscillator();g=c.createGain();g.gain.value=.18;o.connect(g).connect(c.destination);o.start()}function tone(f){base();o.frequency.value=f;setTimeout(stop,1800)}function sweep(){base();let h=false;o.frequency.value=18000;t=setInterval(()=>{h=!h;o.frequency.setValueAtTime(h?20000:18000,c.currentTime)},120);setTimeout(stop,1800)}</script></body></html>
