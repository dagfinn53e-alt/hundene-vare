<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bjeffeknapp"><meta name="theme-color" content="#176b58"><title>Bjeffeknapp</title><style>body{font-family:-apple-system,Arial;background:#eef6f3;color:#17352e;margin:0}.w{max-width:560px;margin:auto;padding:20px}.c{background:white;padding:22px;border-radius:24px;box-shadow:0 8px 25px #0002}h1,h2{text-align:center}button{width:100%;padding:17px;margin:7px 0;border:0;border-radius:15px;background:#176b58;color:white;font-size:18px;font-weight:bold}.main{font-size:28px;padding:30px;background:#c72b2b}.control{background:#2f6fb0}.stop{background:#555}.note{background:#fff3cd;padding:13px;border-radius:12px;margin:15px 0}</style></head><body><div class="w"><div class="c"><h1>🐾 Bjeffeknapp</h1><h2>Hundene Våre</h2><button class="main" onclick="sweep()">🐕<br>BJEFFESTOPP</button><div class="note"><b>Kontrolltest:</b> Trykk først på 5 kHz. Den skal normalt være tydelig hørbar. Deretter tester du de høye frekvensene på hundene.</div><button class="control" onclick="tone(5000)">🔈 KONTROLL 5 kHz – denne skal du høre</button><button onclick="tone(18000)">18 kHz</button><button onclick="tone(19000)">19 kHz</button><button onclick="tone(19500)">19,5 kHz</button><button onclick="tone(20000)">20 kHz</button><button onclick="sweep()">〰️ 18–20 kHz PULS/SVEIP</button><button class="stop" onclick="stop()">■ STOPP LYD</button><p style="text-align:center"><b>www.hundenevåre.com</b></p></div></div><script>let c,o,g,t;function stop(){if(t)clearInterval(t);t=null;try{o&&o.stop()}catch(e){}o=null;if(c){c.close();c=null}}function base(){stop();c=new(window.AudioContext||window.webkitAudioContext)();o=c.createOscillator();g=c.createGain();o.type='sine';g.gain.value=.18;o.connect(g).connect(c.destination);o.start()}function tone(f){base();o.frequency.value=f;setTimeout(stop,1600)}function sweep(){base();let h=false;o.frequency.value=18000;t=setInterval(()=>{h=!h;o.frequency.setValueAtTime(h?20000:18000,c.currentTime)},120);setTimeout(stop,1600)}</script></body></html>
