<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f6b4f" />
  <title>🐾 Spør Hundevennen – Gratis test</title>
  <style>
    :root{
      --green:#0f6b4f;
      --green-dark:#0a4f3b;
      --green-soft:#e8f5ef;
      --cream:#fffaf1;
      --card:#ffffff;
      --text:#24312c;
      --muted:#68756f;
      --line:#dbe7e1;
      --shadow:0 16px 45px rgba(17, 55, 42, .13);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:
      radial-gradient(circle at top left, #eef9f3 0, transparent 34%),
      linear-gradient(180deg,#fbfdfc 0%,#f4f8f6 100%);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      min-height:100%;
    }
    body{padding:18px}
    .app{max-width:760px;margin:0 auto}
.chat{
      margin-top:0;background:var(--card);border:1px solid var(--line);
      border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden
    }
    .chat-top{
      padding:14px 16px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;gap:10px;background:#fbfefd
    }
    .avatar{
      width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
      background:var(--green-soft);font-size:24px
    }
    .chat-top strong{display:block}
    .status{font-size:12px;color:var(--muted);margin-top:2px}
    .status span{color:#15965f}

    .quick-wrap{
      padding:12px 14px 0;background:#fff
    }
    .quick-title{font-size:12px;color:var(--muted);margin:0 0 8px}
    .chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px;scrollbar-width:thin}
    .chip{
      flex:0 0 auto;border:1px solid #bcd7ca;background:#f4fbf7;color:var(--green-dark);
      padding:8px 11px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;
      transition:.2s
    }
    .chip:hover,.chip:focus{background:#e8f5ef;outline:none}

    .messages{
      height:min(54vh,520px);min-height:360px;overflow-y:auto;
      padding:16px;background:
      linear-gradient(rgba(249,252,250,.92),rgba(249,252,250,.92)),
      repeating-linear-gradient(45deg,#edf5f1 0 8px,#f8fbf9 8px 16px)
    }
    .row{display:flex;margin:10px 0}
    .row.user{justify-content:flex-end}
    .bubble{
      max-width:min(82%,560px);padding:11px 13px;border-radius:18px;
      line-height:1.48;white-space:pre-wrap;word-break:break-word;font-size:15px
    }
    .bot .bubble{
      background:#fff;border:1px solid var(--line);border-top-left-radius:6px
    }
    .user .bubble{
      background:var(--green);color:#fff;border-top-right-radius:6px
    }
    .time{display:block;font-size:10px;opacity:.62;margin-top:5px}
    .typing .bubble{color:var(--muted);font-style:italic}

    .composer{
      padding:12px;background:#fff;border-top:1px solid var(--line);
      display:flex;gap:9px;align-items:flex-end
    }
    textarea{
      flex:1;resize:none;min-height:48px;max-height:130px;
      border:1px solid #cbdad3;border-radius:16px;padding:12px 13px;
      font:inherit;color:var(--text);outline:none;background:#fff
    }
    textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,107,79,.10)}
    .send{
      border:0;background:var(--green);color:#fff;font-weight:800;
      min-width:86px;height:48px;border-radius:16px;cursor:pointer;padding:0 15px
    }
    .send:hover{background:var(--green-dark)}
    .guide-link{
    display:inline-block; margin-top:10px; padding:10px 14px; border-radius:12px;
    background:#eef8f1; border:1px solid #b9ddc3; color:#176b35;
    font-weight:800; text-decoration:none;
  }
  .guide-link:hover{ text-decoration:underline; }
.reset{
      border:0;background:transparent;color:var(--green);font-weight:700;
      cursor:pointer;margin-left:auto;font-size:13px
    }
    @media (max-width:600px){
      body{padding:10px}
      .chat{border-radius:18px}
      .messages{height:62vh;min-height:320px;padding:12px}
      .bubble{max-width:88%;font-size:14.5px}
      .send{min-width:72px}
    }
  </style>
</head>
<body>
  <main class="app">
<section class="chat" aria-label="Spør Hundevennen">
      <div class="chat-top">
        <div class="avatar">🐶</div>
        <div>
          <strong>Hundevennen</strong>
          <div class="status"><span>●</span> Klar til å hjelpe</div>
        </div>
        <button class="reset" id="resetBtn" type="button">Start på nytt</button>
      </div>

      <div class="quick-wrap">
        <p class="quick-title">Trykk på et spørsmål eller skriv selv:</p>
        <div class="chips">
          <button class="chip">Hva er Digital Hunde-ID?</button>
          <button class="chip">Hvordan virker Katte-ID?</button>
          <button class="chip">Hunden min er savnet</button>
          <button class="chip">Jeg har funnet en hund</button>
          <button class="chip">Hva er ID-brikken?</button>
          <button class="chip">Blir SMS sendt automatisk?</button>
          <button class="chip">Vises eierens telefon?</button>
          <button class="chip">Hva er Hundeakademiet?</button>
          <button class="chip">Hva er Kattakademiet?</button>
          <button class="chip">Hvordan finner jeg eieren?</button>
          <button class="chip">Hvordan skanner jeg ID-brikken?</button>
          <button class="chip">Hva kan Hundevennen hjelpe med?</button>
          <button class="chip">Hvordan registrerer jeg Hunde-ID?</button>
          <button class="chip">Hvordan registrerer jeg Katte-ID?</button>
          <button class="chip">Hva er eiersiden?</button>
          <button class="chip">Hva ser den som finner dyret?</button>
          <button class="chip">Hvordan får jeg ID-brikken?</button>
          <button class="chip">Hvordan bruker jeg ID-brikken?</button>
          <button class="chip">Brikken åpner ikke siden</button>
          <button class="chip">Må jeg ha en app for å skanne?</button>
          <button class="chip">Hva skjer når dyret blir funnet?</button>
          <button class="chip">Hvordan melder jeg dyret trygt igjen?</button>
          <button class="chip">Kan jeg endre opplysninger på ID-en?</button>
          <button class="chip">Hvordan bytter jeg telefonnummer?</button>
          <button class="chip">Kan jeg bytte bilde?</button>
          <button class="chip">Hva hvis dyret får ny eier?</button>
          <button class="chip">Hva gjør jeg hvis ID-brikken blir borte?</button>
          <button class="chip">Hva hvis ID-brikken blir ødelagt?</button>
          <button class="chip">Kan jeg ha flere dyr på samme eier?</button>
          <button class="chip">Kan samme telefonnummer brukes på flere ID-er?</button>
          <button class="chip">Hva skjer når noen skanner ID-brikken?</button>
        </div>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>

      <form class="composer" id="chatForm">
        <textarea id="userInput" rows="1" placeholder="Skriv spørsmålet ditt her ..." aria-label="Skriv spørsmål"></textarea>
        <button class="send" type="submit">Send</button>
      </form>
    </section>
</main>

<script>
(function(){
  const messages = document.getElementById('messages');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('userInput');
  const resetBtn = document.getElementById('resetBtn');
  const chips = [...document.querySelectorAll('.chip')];

  const welcome =
`Hei! 🐾 Hva kan jeg hjelpe deg med?`;

  function now(){
    return new Date().toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});
  }

  function addMessage(text, who='bot'){
    const row = document.createElement('div');
    row.className = 'row ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if(who === 'bot'){
      bubble.innerHTML = text;
      bubble.querySelectorAll('a').forEach(link => {
        link.setAttribute('target', '_top');
        link.setAttribute('rel', 'noopener');
      });
    } else {
      bubble.textContent = text;
    }
    const t = document.createElement('span');
    t.className = 'time';
    t.textContent = now();
    bubble.appendChild(t);
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function normalize(s){
    return s.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^\wæøå\s-]/g,' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  function has(q, words){
    return words.some(w => q.includes(normalize(w)));
  }

  function answer(raw){
    const q = normalize(raw);

    if(!q) return 'Skriv gjerne et spørsmål, så skal jeg prøve å hjelpe deg. 🐾';

    if(has(q,['hei','hallo','god dag','god kveld','hey'])){
      return 'Hei! 🐾 Hva vil du vite om Hunde-ID, Katte-ID, savnet/funnet dyr, ID-brikken eller akademiene?';
    }

    if(has(q,['automatisk sms','sms sendt','sms varsel','sms-varsel','melding til eier','sms til eier',
      'får eier sms','far eier sms','blir eier varslet','varsles eier','eier varsel',
      'får eieren beskjed','far eieren beskjed','sendes sms automatisk'])){
      return `Ja. Når en finner sender beskjed om at hunden eller katten er funnet, får eieren automatisk SMS-varsel. 📱

Denne chatten sender ikke SMS selv. Den forklarer hvordan varslingen i Hundene Våre fungerer.

<a class="guide-link" href="https://www.xn--hundenevre-85a.com/min-dyre-id.html">🐾 Åpne Min Dyre-ID</a>`;
    }

    if(has(q,['bytte telefonnummer','endre telefonnummer','nytt telefonnummer','endre tlf',
      'bytte tlf','oppdatere telefonnummer','hvordan bytter jeg telefonnummer',
      'hvordan bytter jeg tlf','hvordan bytter til tlf nr','hvordan bytter til tlf.n r',
      'bytte tlf nr','endre tlf nr','nytt tlf nr','bytte nummer','endre nummer',
      'nytt nummer','oppdatere nummer'])){
      return `Hvis du får nytt telefonnummer, bør du oppdatere det på eiersiden. 📱

Da vil riktig nummer brukes videre i Hundene Våre, og du kan samtidig velge om telefonnummeret skal vises offentlig på dyrets ID-side.`;
    }

    if(has(q,['telefon','telefonnummer','tlf','nummer til eier','ringe eier',
      'hvordan finner jeg eieren','hvordan finner jeg eier','finne eieren','finne eier',
      'kontakte eier','kontakte eieren','kan jeg ringe eier','kan jeg ringe eieren',
      'hvor er telefonnummeret','vises nummeret','skjule nummer','skjult nummer'])){
      return `Eieren bestemmer selv om telefonnummeret skal vises på den digitale ID-siden.

Hvis nummeret er synlig, kan finneren ringe eieren direkte. Hvis nummeret er skjult, kan finneren fortsatt sende beskjed om at dyret er funnet uten at telefonnummeret vises offentlig.`;
    }

    if(has(q,['brikken åpner ikke siden','brikken apner ikke siden','nfc virker ikke',
      'brikken virker ikke','id brikken virker ikke','får ikke skannet brikken',
      'far ikke skannet brikken','telefonen leser ikke brikken','hva gjør jeg hvis nfc brikken ikke åpner siden','hva gjor jeg hvis nfc brikken ikke apner siden','nfc brikken åpner ikke siden','nfc brikken apner ikke siden','hva gjør jeg hvis brikken ikke virker','hva gjor jeg hvis brikken ikke virker'])){
      return `Hvis ID-brikken ikke åpner siden, prøv dette:

• Hold toppen av mobilen rolig helt inntil brikken i et par sekunder.
• Flytt mobilen litt rundt over brikken hvis den ikke reagerer med en gang.
• Sørg for at skjermen er på og telefonen er låst opp.
• Prøv eventuelt med en annen nyere mobil.

Hvis brikken fortsatt ikke reagerer, kan den eller lenken på brikken måtte kontrolleres.`;
    }

    if(has(q,['må jeg ha en app','ma jeg ha en app','trenger jeg app','egen app',
      'app for å skanne','app for a skanne','nfc app','må finner ha app','ma finner ha app'])){
      return `Nei. På de fleste nyere mobiltelefoner trenger du ikke en egen app for å skanne ID-brikken. 📱

Hold mobilen inntil NFC-brikken. Når telefonen registrerer brikken, får du opp lenken til hundens eller kattens digitale ID-side.

Trykk på lenken for å åpne ID-siden.`;
    }

    if(has(q,['hva skjer når dyret blir funnet','hva skjer nar dyret blir funnet',
      'når hunden blir funnet','nar hunden blir funnet','når katten blir funnet',
      'nar katten blir funnet','dyret er funnet','funnet igjen'])){
      return `Når noen finner hunden eller katten, kan de skanne ID-brikken og åpne dyrets digitale ID-side. 🐾

Der kan finneren sende beskjed om at dyret er funnet. Eieren får automatisk SMS-varsel og kan kontakte finneren.

Når dyret er trygt hjemme igjen, kan eieren markere det som trygt på eiersiden.`;
    }

    if(has(q,['melde trygt','meld trygg','melde dyret trygt','markere trygg','markere som trygg',
      'trygt igjen','hunden er hjemme','katten er hjemme','hjemme igjen'])){
      return `Når hunden eller katten er hjemme igjen, går eieren inn på den private eiersiden. 🏠🐾

Der markerer eieren dyret som trygt igjen. Da skal det ikke lenger stå som savnet.`;
    }

    if(has(q,['brikken blir borte','mistet id brikke','mistet id-brikke','mistet id-brikken',
      'jeg har mistet id-brikken','jeg har mistet id brikken','mistet brikken','id brikken er borte',
      'brikken er borte','mista brikken','mistet nfc brikke','mistet brikke','mista id brikken','mista id-brikken','hva gjør jeg hvis jeg mister brikken','hva gjor jeg hvis jeg mister brikken','id brikke mistet','id-brikke mistet'])){
      return `Hvis ID-brikken blir borte, bør eieren få laget eller bestilt en ny brikke som kobles til den samme digitale ID-en. 🐾

Selve Hunde-ID-en eller Katte-ID-en kan fortsatt beholdes. Det er bare den fysiske brikken som må erstattes.`;
    }

    if(has(q,['brikken blir ødelagt','brikken er ødelagt','id brikken er ødelagt',
      'nfc brikken virker ikke lenger','brikken er skadet','ødelagt nfc brikke','ødelagt brikke','id brikke ødelagt','id-brikke ødelagt','brikken knust','brikken skadet'])){
      return `Hvis ID-brikken er ødelagt eller ikke kan leses lenger, bør den erstattes med en ny brikke. 🔧🐾

Den nye brikken kan kobles til den samme digitale Hunde-ID-en eller Katte-ID-en, slik at opplysningene kan beholdes.`;
    }

    if(has(q,['hva skjer når noen skanner id-brikken','hva skjer nar noen skanner id-brikken',
      'hva skjer når noen skanner id brikken','hva skjer nar noen skanner id brikken',
      'når noen skanner brikken','nar noen skanner brikken','skanner id-brikken',
      'skanner id brikken'])){
      return `Når noen skanner ID-brikken med mobilen, åpnes hundens eller kattens digitale ID-side. 📱🐾

Der kan finneren se informasjonen eieren har valgt å vise. Hvis telefonnummeret er synlig, kan finneren ringe eieren direkte.

Finneren kan også sende beskjed om at dyret er funnet, og eieren får automatisk SMS-varsel.`;
    }

    if(has(q,['id-brikke','id brikke','nfc','brikken','halsband','halsbånd',
      'skanne brikke','skanner brikken','scan brikke','hvordan skanner jeg',
      'hvordan virker brikken','hvordan fungerer brikken','holde mobilen inntil',
      'brikke på halsbånd','brikke pa halsband'])){
      return `ID-brikken festes på hundens eller kattens halsbånd. 🐾

Finneren skanner brikken med mobilen ved å holde telefonen inntil NFC-brikken. Da åpnes dyrets digitale ID-side automatisk.

På ID-siden kan finneren se informasjonen eieren har valgt å vise og sende beskjed om at dyret er funnet.`;
    }

    if(has(q,['registrere hunde id','registrere hunde-id','hvordan registrerer jeg hunde id',
      'hvordan registrerer jeg hunde-id','opprette hunde id','opprette hunde-id',
      'hvordan får jeg hunde id','hvordan får jeg hunde-id','hvordan får jeg en hunde id',
      'hvordan får jeg en hunde-id','få hunde id','få hunde-id'])){
      return `For å få Digital Hunde-ID registrerer eieren hundens opplysninger i registreringsskjemaet hos Hundene Våre. 🐶

Der legges blant annet inn navn, bilde og annen informasjon eieren ønsker å bruke på ID-siden.

Når registreringen er klar, får hunden sin egen digitale ID som kan kobles til ID-brikken.

<a class="guide-link" href="https://www.xn--hundenevre-85a.com/min-hunde-id.html#registrer-hund">🐶 Registrer Hunde-ID</a>`;
    }

    if(has(q,['registrere katte id','registrere katte-id','hvordan registrerer jeg katte id',
      'hvordan registrerer jeg katte-id','opprette katte id','opprette katte-id',
      'hvordan får jeg katte id','hvordan får jeg katte-id','hvordan får jeg en katte id',
      'hvordan får jeg en katte-id','få katte id','få katte-id'])){
      return `For å få Katte-ID registrerer eieren kattens opplysninger i registreringsskjemaet hos Hundene Våre. 🐱

Der legges blant annet inn navn, bilde og annen informasjon eieren ønsker å bruke på ID-siden.

Når registreringen er klar, får katten sin egen digitale ID som kan kobles til ID-brikken.

<a class="guide-link" href="https://www.xn--hundenevre-85a.com/min-katte-id.html#registrer-katt">🐱 Registrer Katte-ID</a>`;
    }

    if(has(q,['digital hunde-id','hunde-id','hunde id','hundens id',
      'hva er hunde id','hvordan virker hunde id','hvordan fungerer hunde id',
      'digital id hund','id til hund','registrere hunde id'])){
      return `Digital Hunde-ID er hundens digitale ID hos Hundene Våre. 🐶

Hvis noen finner hunden din, skanner de ID-brikken med mobilen. Da åpnes hundens digitale ID-side med informasjonen du som eier har valgt å vise.

Finneren kan sende beskjed om at hunden er funnet, og du får automatisk SMS-varsel. Du bestemmer selv om telefonnummeret ditt skal være synlig, slik at finneren kan ringe deg direkte.`;
    }

    if(has(q,['katte-id','katte id','digital katte','kattens id',
      'hva er katte id','hvordan virker katte id','hvordan fungerer katte id',
      'digital id katt','id til katt','registrere katte id'])){
      return `Katte-ID er kattens digitale ID hos Hundene Våre. 🐱

Hvis noen finner katten din, skanner de ID-brikken med mobilen. Da åpnes kattens digitale ID-side med informasjonen du som eier har valgt å vise.

Finneren kan sende beskjed om at katten er funnet, og du får automatisk SMS-varsel. Du bestemmer selv om telefonnummeret ditt skal være synlig, slik at finneren kan ringe deg direkte.`;
    }

    if((has(q,['savnet','borte','forsvunnet']) && has(q,['hund','valp'])) || q === 'hunden min er savnet'){
      return `Er hunden din savnet, går du inn på eiersiden for Hunde-ID og trykker «Meld savnet». 🐶

Hunden blir da markert som savnet på den digitale ID-siden og kan vises i oversikten over savnede hunder.

Når hunden er hjemme igjen, går du tilbake til eiersiden og markerer den som trygg.`;
    }

    if((has(q,['savnet','borte','forsvunnet']) && has(q,['katt','katten']))){
      return `Er katten din savnet, går du inn på eiersiden for Katte-ID og trykker «Meld savnet». 🐱

Katten blir da markert som savnet på den digitale ID-siden og kan vises i oversikten over savnede katter.

Når katten er hjemme igjen, går du tilbake til eiersiden og markerer den som trygg.`;
    }

    if(has(q,['funnet en hund','fant en hund','har funnet hund','hund funnet'])){
      return `Har du funnet en hund med Hundene Våre-ID, skanner du ID-brikken med mobilen.

Da åpnes hundens digitale ID-side, hvor du kan se opplysningene eieren har valgt å vise. Du kan også sende beskjed om at hunden er funnet, og eieren får automatisk SMS-varsel.`;
    }

    if(has(q,['funnet en katt','fant en katt','har funnet katt','katt funnet'])){
      return `Har du funnet en katt med Hundene Våre Katte-ID, skanner du ID-brikken med mobilen.

Da åpnes kattens digitale ID-side, hvor du kan se opplysningene eieren har valgt å vise. Du kan også sende beskjed om at katten er funnet, og eieren får automatisk SMS-varsel.`;
    }

    if(has(q,['hundeakademiet','hunde akademiet','kurs hund','hundekurs',
      'lære om hund','laere om hund','hundekunnskap','moduler hund','kurs for hundeeiere','akademi hund'])){
      return `Hundeakademiet er kunnskapsdelen for hundeeiere i Hundene Våre. 🐶📚

Her finner du 9 moduler om hundehold, valp, lydighet, atferd, trening, hverdagsliv, aktivisering, helse, stell og førstehjelp.

<a class="guide-link" href="https://www.xn--hundenevre-85a.com/hundeakademiet_ny.html">🎓 Åpne Hundeakademiet</a>

Du kan også gå direkte til en modul:

<a class="guide-link" href="https://www.xn--hundenevre-85a.com/modul1-bli-kjent-med-hunden.html">🐕 Modul 1 – Bli kjent med hunden</a>
<a class="guide-link" href="https://www.xn--hundenevre-85a.com/modul2-valpen-den-viktige-starten.html">🐶 Modul 2 – Valpen – den viktige starten</a>
<a class="guide-link" href="https://www.xn--hundenevre-85a.com/modul3-grunnleggende-lydighet.html">🎓 Modul 3 – Grunnleggende lydighet</a>
<a class="guide-link" href="https://www.xn--hundenevre-85a.com/modul4-atferd-og-problemlosning.html">💜 Modul 4 – Atferd og problemløsning</a>

  function send(text){
    const clean = text.trim();
    if(!clean) return;
    addMessage(clean,'user');
    input.value = '';
    input.style.height = '48px';

    const typing = document.createElement('div');
    typing.className = 'row bot typing';
    typing.innerHTML = '<div class="bubble">Hundevennen skriver …</div>';
    messages.appendChild(typing);
    messages.scrollTop = messages.scrollHeight;

    setTimeout(()=>{
      typing.remove();
      addMessage(answer(clean),'bot');
    }, 350);
  }

  form.addEventListener('submit', e=>{
    e.preventDefault();
    send(input.value);
  });

  input.addEventListener('input', ()=>{
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight,130) + 'px';
  });

  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      form.requestSubmit();
    }
  });

  chips.forEach(chip=>{
    chip.addEventListener('click',()=>send(chip.textContent));
  });

  resetBtn.addEventListener('click',()=>{
    messages.innerHTML='';
    addMessage(welcome,'bot');
    input.focus();
  });

  addMessage(welcome,'bot');
})();
