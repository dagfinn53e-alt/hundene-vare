<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin – Butikker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(180deg,#eaf4ff,#f8fbff);color:#0f172a}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #dbeafe;border-radius:24px;padding:18px 20px;box-shadow:0 10px 28px rgba(15,23,42,.08);margin-bottom:18px}h1{margin:0;color:#1d4ed8;font-size:28px}.back{padding:11px 16px;border-radius:999px;background:#eaf2ff;color:#1d4ed8;border:1px solid #bfd7ff;text-decoration:none;font-weight:900}.panel{background:#fff;border:1px solid #dbeafe;border-radius:24px;padding:20px;box-shadow:0 10px 28px rgba(15,23,42,.08);margin-bottom:18px}.status{padding:13px 15px;border-radius:16px;background:#f8fbff;border:1px solid #dbeafe;font-weight:800;margin-bottom:14px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid #dbeafe;border-radius:22px;padding:18px;background:linear-gradient(180deg,#fff,#f8fbff);box-shadow:0 8px 22px rgba(15,23,42,.06)}.head{display:flex;gap:14px;align-items:flex-start}.logo{width:82px;height:82px;object-fit:contain;border-radius:18px;border:1px solid #e2e8f0;background:#fff;padding:7px}.name{font-size:22px;font-weight:900;margin:0 0 5px}.meta{color:#64748b;font-weight:700;line-height:1.45}.desc{margin-top:12px;color:#334155;line-height:1.5;white-space:pre-wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}button,.btn{border:none;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.approve{background:#16a34a;color:#fff}.delete{background:#dc2626;color:#fff}.edit{background:#111827;color:#fff}.view{background:#2563eb;color:#fff}.refresh{background:#7c3aed;color:#fff}.empty{grid-column:1/-1;padding:24px;text-align:center;border:1px dashed #cbd5e1;border-radius:18px;color:#64748b;font-weight:800}@media(max-width:800px){.list{grid-template-columns:1fr}}@media(max-width:600px){body{padding:10px}.actions{flex-direction:column}.actions>*{width:100%}.head{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<h1>🔧 Admin – Butikker</h1>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button class="refresh" onclick="loadAll()">🔄 Oppdater</button>
<a class="back" href="index.html">← Til forsiden</a>
</div>
</header>

<section class="panel">
<h2>⏳ Venter på godkjenning</h2>
<div id="pendingStatus" class="status">Laster ...</div>
<div id="pendingList" class="list"></div>
</section>

<section class="panel">
<h2>✅ Godkjente butikker</h2>
<div id="approvedStatus" class="status">Laster ...</div>
<div id="approvedList" class="list"></div>
</section>
</div>

<script>
const supabaseClient=window.supabase.createClient("https://kxudiviidwwwclbzgdyx.supabase.co","sb_publishable_EaSgrgWqXKnaRRRkKparWA_ZmmRG8QH");
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function safeUrl(v){const u=String(v||"").trim();return /^https?:\/\//i.test(u)?u:""}
function card(item,pending){
 const logo=safeUrl(item.logo_url);
 return `<article class="card" id="card-${esc(item.id)}">
 <div class="head">
 ${logo?`<img class="logo" src="${esc(logo)}" alt="Logo">`:`<div class="logo" style="display:grid;place-items:center;font-size:34px">🏪</div>`}
 <div><h3 class="name">${esc(item.name||"Uten navn")}</h3>
 <div class="meta">${esc(item.type||"Ukjent type")} • ${esc(item.region||"Ukjent område")}</div>
 <div class="meta">${esc(item.place||item.address||"")}</div></div></div>
 <div class="desc">${esc(item.description||"Ingen beskrivelse")}</div>
 <div class="actions">
 ${pending?`<button class="approve" onclick="approveShop('${esc(item.id)}')">✅ Godkjenn</button>`:""}
 <a class="edit" href="rediger-butikk.html?id=${esc(item.id)}">✏️ Rediger</a>
 <a class="view" href="butikk.html?id=${esc(item.id)}" target="_blank">👁️ Se butikk</a>
 <button class="delete" onclick="deleteShop('${esc(item.id)}')">🗑️ Slett</button>
 </div></article>`;
}
async function loadSection(approved,listId,statusId){
 const list=document.getElementById(listId),status=document.getElementById(statusId);
 status.textContent="Laster ...";
 const {data,error}=await supabaseClient.from("businesses").select("*").eq("approved",approved).order("name",{ascending:true});
 if(error){status.textContent="❌ Feil: "+error.message;list.innerHTML='<div class="empty">Kunne ikke laste butikker.</div>';return}
 const rows=data||[];status.textContent=rows.length+" butikk(er)";
 list.innerHTML=rows.length?rows.map(x=>card(x,!approved)).join(""):'<div class="empty">Ingen butikker her.</div>';
}
async function loadAll(){await Promise.all([loadSection(false,"pendingList","pendingStatus"),loadSection(true,"approvedList","approvedStatus")])}
async function approveShop(id){if(!confirm("Godkjenne denne butikken?"))return;const {error}=await supabaseClient.from("businesses").update({approved:true}).eq("id",id);if(error){alert("Feil: "+error.message);return}loadAll()}
async function deleteShop(id){if(!confirm("Slette denne butikken permanent?"))return;const {error}=await supabaseClient.from("businesses").delete().eq("id",id);if(error){alert("Feil: "+error.message);return}loadAll()}
loadAll();
</script>
</body>
</html>
