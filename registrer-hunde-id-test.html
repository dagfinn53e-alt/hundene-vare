<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrer Hunde-ID</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{margin:0;background:#f3f7f4;font-family:Arial;color:#17221c}header{background:#07563f;color:white;text-align:center;padding:22px}main{max-width:680px;margin:auto;padding:16px}.card{background:white;padding:20px;border-radius:20px;margin-bottom:15px;box-shadow:0 5px 20px #0002}label{display:block;font-weight:bold;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:10px;font-size:16px}button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:12px;background:#07563f;color:white;font-size:16px;font-weight:bold}.hidden{display:none}.ok{background:#e4f5e9;padding:12px;border-radius:10px}.err{background:#ffe5e8;padding:12px;border-radius:10px}#qr{display:flex;justify-content:center;margin:18px}</style></head>
<body><header><h2>🐾 HUNDENE VÅRE</h2>Registrer Digital Hunde-ID</header><main><div class="card"><h2>🐶 Registrer hund</h2>
<label>Hundens navn *</label><input id="n"><label>Rase *</label><input id="r"><label>Kjønn</label><select id="s"><option></option><option>Tispe</option><option>Hannhund</option></select>
<label>Farge</label><input id="c"><label>Eierens e-post *</label><input id="e" type="email"><label>Velg PIN *</label><input id="p" type="password" inputmode="numeric">
<button onclick="reg()">🐾 OPPRETT HUNDE-ID</button><div id="m"></div></div>
<div id="res" class="card hidden"><h2>🎉 Hunde-ID opprettet</h2><h2 id="rn"></h2><p id="ri"></p><h3 id="code"></h3><div id="qr"></div></div></main>
<script>
const sb=supabase.createClient("https://kxudiviidwwwclbzgdyx.supabase.co","sb_publishable_EaSgrgWqXKnaRRRkKparWA_ZmmRG8QH");
function code(){let x="HV-",a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";for(let i=0;i<8;i++)x+=a[Math.floor(Math.random()*a.length)];return x}
async function reg(){let d=code(),n=document.getElementById('n').value.trim(),r=document.getElementById('r').value.trim(),s=document.getElementById('s').value,c=document.getElementById('c').value.trim(),e=document.getElementById('e').value.trim(),p=document.getElementById('p').value.trim(),m=document.getElementById('m');if(!n||!r||!e||p.length<4){m.innerHTML='<p class="err">Fyll inn navn, rase, e-post og PIN på minst 4 tegn.</p>';return}m.innerHTML='<p class="ok">Oppretter…</p>';let {error}=await sb.rpc('register_dog_id',{p_dog_code:d,p_dog_name:n,p_breed:r,p_sex:s||null,p_color:c||null,p_owner_email:e,p_owner_pin:p});if(error){m.innerHTML='<p class="err">'+error.message+'</p>';return}m.innerHTML='';document.getElementById('res').classList.remove('hidden');document.getElementById('rn').textContent=n+' 🐾';document.getElementById('ri').textContent=[r,s,c].filter(Boolean).join(' · ');document.getElementById('code').textContent=d;new QRCode(document.getElementById('qr'),{text:'https://www.xn--hundenevre-85a.com/hunde-id.html?id='+encodeURIComponent(d),width:220,height:220});}
</script></body></html>
