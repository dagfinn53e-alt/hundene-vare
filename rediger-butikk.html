<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rediger butikk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  padding:20px;
  background:#eaf4ff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  border-radius:24px;
  padding:24px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:8px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #cbd5e1;
  font-size:16px;
  box-sizing:border-box;
}

textarea{
  min-height:120px;
}

.preview{
  width:140px;
  height:140px;
  object-fit:cover;
  border-radius:18px;
  background:#f1f5f9;
  margin-bottom:12px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
  margin-top:14px;
}

.gallery img{
  width:100%;
  height:140px;
  object-fit:cover;
  border-radius:16px;
}

button{
  margin-top:24px;
  padding:16px 24px;
  border:none;
  border-radius:16px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.status{
  margin-bottom:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>✏️ Rediger butikk</h1>

<a href="javascript:history.back()">← Tilbake til butikksiden</a>

<div id="status" class="status">
Laster butikk...
</div>

<div id="editor" style="display:none;">

<label>Logo</label>

<img id="logoPreview" class="preview">

<input type="file" id="logoInput">

<label>Butikknavn</label>
<input type="text" id="name">

<label>Beskrivelse</label>
<textarea id="description"></textarea>

<label>Telefon</label>
<input type="text" id="phone">

<label>Facebook / Nettside</label>
<input type="text" id="website">

<label>🎥 Reel-link</label>
<input type="text" id="reel">


<label>Butikkmodell</label>
<select id="businessModel" onchange="toggleOnlineFields()">
  <option value="physical">🏪 Fysisk butikk / tjeneste</option>
  <option value="online">🛒 Nettbutikk</option>
  <option value="both">🏪🛒 Fysisk butikk + nettbutikk</option>
</select>

<div id="onlineFields" style="display:none;">
  <label>Nettbutikkadresse</label>
  <input type="url" id="onlineStoreUrl" placeholder="https://www.nettbutikken.no">

  <label>Leveringsområde</label>
  <select id="deliveryArea">
    <option value="Hele Norge">Hele Norge</option>
    <option value="Norge og Norden">Norge og Norden</option>
    <option value="Europa">Europa</option>
    <option value="Hele verden">Hele verden</option>
    <option value="Lokalt område">Lokalt område</option>
  </select>

  <label>Fraktinformasjon</label>
  <textarea id="shippingInfo" placeholder="For eksempel fast frakt, Posten, Bring eller henting"></textarea>

  <label>Gratis frakt over</label>
  <input type="text" id="freeShippingLimit" placeholder="For eksempel 799 kr">

  <label>Rabattkode</label>
  <input type="text" id="discountCode" placeholder="Valgfritt">

  <label>Leveringstid</label>
  <input type="text" id="deliveryTime" placeholder="For eksempel 2–5 virkedager">
</div>

<label>Last opp bilder</label>
<input type="file" id="galleryInput" multiple>

<div id="gallery" class="gallery"></div>

<button onclick="saveShop()">
💾 Lagre Endringer
</button>

</div>

</div>

</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://kxudiviidwwwclbzgdyx.supabase.co",
  "sb_publishable_EaSgrgWqXKnaRRRkKparWA_ZmmRG8QH"
);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

let shop = {};
let galleryUrls = [];

function setStatus(text,color="black"){
  const el = document.getElementById("status");
  el.textContent = text;
  el.style.color = color;
}


function toggleOnlineFields(){
  const model = document.getElementById("businessModel").value;
  const fields = document.getElementById("onlineFields");
  fields.style.display = (model === "online" || model === "both") ? "block" : "none";
}

function getOnlineValue(data, key, fallback=""){
  return data && data[key] != null ? data[key] : fallback;
}

function isMissingColumnError(message){
  const text = String(message || "").toLowerCase();
  return text.includes("column") ||
         text.includes("schema cache") ||
         text.includes("business_model") ||
         text.includes("online_store_url");
}

function buildFallbackDescription(description, onlineData){
  if(onlineData.business_model === "physical"){
    return description;
  }

  const base = String(description || "").replace(/\n*— NETTBUTIKKOPPLYSNINGER —[\s\S]*$/,"").trim();

  const lines = [
    base,
    "",
    "— NETTBUTIKKOPPLYSNINGER —",
    "Butikkmodell: " + (
      onlineData.business_model === "both"
        ? "Fysisk butikk + nettbutikk"
        : "Nettbutikk"
    ),
    "Nettbutikk: " + (onlineData.online_store_url || "Ikke oppgitt"),
    "Leveringsområde: " + (onlineData.delivery_area || "Ikke oppgitt"),
    "Fraktinformasjon: " + (onlineData.shipping_info || "Ikke oppgitt"),
    "Gratis frakt over: " + (onlineData.free_shipping_limit || "Ikke oppgitt"),
    "Rabattkode: " + (onlineData.discount_code || "Ingen"),
    "Leveringstid: " + (onlineData.delivery_time || "Ikke oppgitt")
  ];

  return lines.join("\n").trim();
}

async function loadShop(){

  try{

    if(!id){
      setStatus("Mangler butikk-ID","crimson");
      return;
    }

    const { data, error } =
      await supabaseClient
      .from("businesses")
      .select("*")
      .eq("id",id)
      .single();

    if(error){
      console.log(error);
      setStatus("Feil fra Supabase","crimson");
      return;
    }

    if(!data){
      setStatus("Fant ikke butikk","crimson");
      return;
    }

    shop = data;

    document.getElementById("editor")
      .style.display = "block";

    document.getElementById("status")
      .style.display = "none";

    document.getElementById("name").value =
      data.name || "";

    document.getElementById("description").value =
      data.description || "";

    document.getElementById("phone").value =
      data.phone || "";

    document.getElementById("website").value =
      data.website || "";

    document.getElementById("reel").value =
      data.reel_url || "";

    document.getElementById("businessModel").value =
      getOnlineValue(data,"business_model","physical");

    document.getElementById("onlineStoreUrl").value =
      getOnlineValue(data,"online_store_url","");

    document.getElementById("deliveryArea").value =
      getOnlineValue(data,"delivery_area","Hele Norge");

    document.getElementById("shippingInfo").value =
      getOnlineValue(data,"shipping_info","");

    document.getElementById("freeShippingLimit").value =
      getOnlineValue(data,"free_shipping_limit","");

    document.getElementById("discountCode").value =
      getOnlineValue(data,"discount_code","");

    document.getElementById("deliveryTime").value =
      getOnlineValue(data,"delivery_time","");

    toggleOnlineFields();

    document.getElementById("logoPreview").src =
      data.logo_url || "";

    try{

      galleryUrls =
        data.gallery_urls || [];

      if(typeof galleryUrls === "string"){
        galleryUrls = JSON.parse(galleryUrls);
      }

    }catch{
      galleryUrls = [];
    }

    renderGallery();

  }catch(err){

    console.log(err);

    setStatus(
      "Krasj i loadShop()",
      "crimson"
    );
  }
}

function renderGallery(){

  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML =
  galleryUrls.map((url,index) => `
    <div style="position:relative;">
      <img src="${url}">
      
      <button
        onclick="deleteImage(${index})"
        style="
          position:absolute;
          top:6px;
          right:6px;
          background:crimson;
          color:white;
          border:none;
          border-radius:10px;
          padding:6px 10px;
          cursor:pointer;
          font-size:12px;
        "
      >
        Slett
      </button>
    </div>
  `).join("");
}

async function uploadFile(file,path){

  const filename =
    Date.now() + "-" + file.name;

  const fullpath =
    path + "/" + filename;

  const { error } =
    await supabaseClient.storage
    .from("story-images")
    .upload(fullpath,file);

  if(error){
    console.log(error);
    return null;
  }

  const { data } =
    supabaseClient.storage
    .from("story-images")
    .getPublicUrl(fullpath);

  return data.publicUrl;
}

document.getElementById("logoInput")
.addEventListener("change", async(e)=>{

  const file = e.target.files[0];

  if(!file) return;

  setStatus("Laster opp logo...");

  const url =
    await uploadFile(file,"logos");

  if(url){

    shop.logo_url = url;

    document.getElementById("logoPreview").src =
      url;

    setStatus("✅ Logo lastet opp","green");
  }
});

document.getElementById("galleryInput")
.addEventListener("change", async(e)=>{

  const files = [...e.target.files];

  if(files.length === 0) return;

  setStatus("Laster opp bilder...");

  for(const file of files){

    const url =
      await uploadFile(file,"gallery");

    if(url){
      galleryUrls.push(url);
    }
  }

  renderGallery();

  setStatus("✅ Bilder lastet opp","green");
});
function deleteImage(index){

  if(!confirm("Slette dette bildet?")){
    return;
  }

  galleryUrls.splice(index,1);

  renderGallery();
}
async function saveShop(){

  setStatus("Lagrer...");

  const businessModel =
    document.getElementById("businessModel").value;

  const onlineData = {
    business_model: businessModel,
    online_store_url:
      document.getElementById("onlineStoreUrl").value.trim(),
    delivery_area:
      document.getElementById("deliveryArea").value,
    shipping_info:
      document.getElementById("shippingInfo").value.trim(),
    free_shipping_limit:
      document.getElementById("freeShippingLimit").value.trim(),
    discount_code:
      document.getElementById("discountCode").value.trim(),
    delivery_time:
      document.getElementById("deliveryTime").value.trim()
  };

  if((businessModel === "online" || businessModel === "both") &&
     !onlineData.online_store_url){
    setStatus("❌ Skriv inn nettbutikkadressen","crimson");
    return;
  }

  const updateData = {
    name:
      document.getElementById("name").value,

    description:
      document.getElementById("description").value,

    phone:
      document.getElementById("phone").value,

    website:
      onlineData.online_store_url ||
      document.getElementById("website").value,

    reel_url:
      document.getElementById("reel").value,

    logo_url:
      shop.logo_url || "",

    gallery_urls:
      galleryUrls,

    business_model:
      onlineData.business_model,

    online_store_url:
      onlineData.online_store_url,

    delivery_area:
      onlineData.delivery_area,

    shipping_info:
      onlineData.shipping_info,

    free_shipping_limit:
      onlineData.free_shipping_limit,

    discount_code:
      onlineData.discount_code,

    delivery_time:
      onlineData.delivery_time
  };

  let { error } =
    await supabaseClient
    .from("businesses")
    .update(updateData)
    .eq("id",id);

  if(error && isMissingColumnError(error.message)){

    const fallbackData = {
      name:
        document.getElementById("name").value,

      description:
        buildFallbackDescription(
          document.getElementById("description").value,
          onlineData
        ),

      phone:
        document.getElementById("phone").value,

      website:
        onlineData.online_store_url ||
        document.getElementById("website").value,

      reel_url:
        document.getElementById("reel").value,

      logo_url:
        shop.logo_url || "",

      gallery_urls:
        galleryUrls
    };

    const fallbackResult =
      await supabaseClient
      .from("businesses")
      .update(fallbackData)
      .eq("id",id);

    error = fallbackResult.error;
  }

  if(error){

    console.log(error);

    setStatus(
      "❌ Feil ved lagring",
      "crimson"
    );

    return;
  }

  setStatus(
    "✅ Endringer lagret",
    "green"
  );
}

toggleOnlineFields();
loadShop();
</script>

</body>
</html>
