<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bjeffeknapp frekvenstest</title><style>
*{box-sizing:border-box}body{margin:0;background:#102033;color:#fff;font-family:Arial,sans-serif}.w{max-width:650px;margin:auto;padding:15px}.c{background:white;color:#142235;padding:18px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}h1{text-align:center;margin:6px 0 18px;font-size:38px;line-height:1.08}p.intro{text-align:center;font-size:20px;line-height:1.35;margin:0 0 18px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;justify-items:center}button{padding:10px;border:0;border-radius:50%;font-size:19px;font-weight:bold;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s,outline .08s}button:active{transform:scale(.98)}button.active{outline:5px solid #142235;box-shadow:0 0 0 3px #fff,0 6px 14px rgba(0,0,0,.25)}.ctl{width:100%;border-radius:999px;padding:18px 16px;background:#1976d2;color:white;margin-bottom:12px}.f15{background:#48b86a;color:#fff}.f16{background:#22a89a;color:#fff}.f17{background:#1597c5;color:#fff}.f18{background:#446fd1;color:#fff}.f19{background:#7254c7;color:#fff}.f195{background:#9b4db6;color:#fff}.f20{background:#e06a3b;color:#fff}.sw{grid-column:1/-1;width:100%;height:auto;border-radius:999px;padding:19px 12px;background:#ffb020;color:#123d68}.stop{width:100%;height:auto;border-radius:999px;padding:19px 12px;background:#d92d20;color:white;margin-top:12px}.s{text-align:center;font-weight:bold;font-size:20px;margin:16px 0;color:#123d68;min-height:24px}.n{background:#f3f6f8;padding:14px;border-radius:14px;line-height:1.45;font-size:16px}@media(max-width:480px){h1{font-size:34px}.c{padding:16px}.w{padding:10px}button{font-size:18px;padding:18px 6px}}
</style></head><body><div class="w"><div class="c"><h1>🐕 Bjeffeknapp<br>TEST</h1><p class="intro">Finn frekvensen hunden reagerer tydeligst på</p><button class="ctl" data-label="Kontroll 5 kHz" onclick="tone(5000,this)">🔈 KONTROLL 5 kHz – denne skal du høre</button><div class="g"><button class="f15" onclick="tone(15000,this)">15 kHz</button><button class="f16" onclick="tone(16000,this)">16 kHz</button><button class="f17" onclick="tone(17000,this)">17 kHz</button><button class="f18" onclick="tone(18000,this)">18 kHz</button><button class="f19" onclick="tone(19000,this)">19 kHz</button><button class="f195" onclick="tone(19500,this)">19,5 kHz</button><button class="f20" onclick="tone(20000,this)">20 kHz</button><button class="sw" onclick="sweep(this)">↗️ 15–20 kHz SVEIP</button></div><button class="stop" onclick="stop()">⏹ STOPP LYD</button><div class="s" id="s">Klar til test</div><div class="n"><b>Test enkelt:</b> Vent til hunden bjeffer naturlig. Trykk én gang på én frekvens. Se om hunden stopper, snur hodet eller søker etter lyden. Bruk korte signaler og stopp dersom hunden virker redd eller stresset.</div></div></div><script>
let c,o,g,t,activeBtn=null;function ac(){if(!c)c=new(AudioContext||webkitAudioContext)();if(c.state==="suspended")c.resume();return c}function clearActive(){document.querySelectorAll("button.active").forEach(b=>b.classList.remove("active"));activeBtn=null}function stop(){if(t)clearTimeout(t);if(o){try{o.stop()}catch(e){}o=null}clearActive();document.getElementById("s").textContent="Stoppet"}function begin(f,b){stop();if(b){b.classList.add("active");activeBtn=b}let x=ac();o=x.createOscillator();g=x.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(x.destination);o.start();return x}function tone(f,b){begin(f,b);document.getElementById("s").textContent="Tester "+(f/1000).toString().replace(".",",")+" kHz";t=setTimeout(stop,1400)}function sweep(b){let x=begin(15000,b);o.frequency.exponentialRampToValueAtTime(20000,x.currentTime+1.35);document.getElementById("s").textContent="Tester 15–20 kHz sveip";t=setTimeout(stop,1400)}
</script></body></html><style>@media(max-width:420px){.f{width:118px;height:118px;font-size:18px}}</style>
