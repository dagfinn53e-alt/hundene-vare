<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eierside – Hundene Våre Hunde-ID</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f4;font-family:system-ui,-apple-system,Segoe UI,Arial;color:#17221c}
header{background:linear-gradient(135deg,#07563f,#06392b);color:#fff;text-align:center;padding:22px 15px}
main{max-width:760px;margin:auto;padding:17px 14px 50px}.card{background:#fff;border:1px solid #e1eae4;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 8px 28px #00000012}
.center{text-align:center}.dog{width:160px;height:160px;border-radius:50%;object-fit:cover;border:7px solid #e7f3ec}.placeholder{width:160px;height:160px;border-radius:50%;border:7px solid #e7f3ec;background:#edf4ef;display:grid;place-items:center;margin:auto;font-size:62px}
h2{margin:8px 0}.muted{color:#66736b}.badge{display:inline-block;padding:8px 13px;border-radius:999px;font-weight:850;margin:10px}.safe{background:#e5f6eb;color:#17603c}.missing{background:#ffe3e7;color:#b0182c}
input,select{width:100%;padding:12px;border:1px solid #cbd7cf;border-radius:10px;font:inherit;margin:5px 0 10px}label{font-weight:800;display:block}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:850;cursor:pointer;margin-top:10px}.green{background:#07563f;color:#fff}.red{background:#cf2940;color:#fff}.outline{background:#fff;color:#07563f;border:2px solid #07563f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.ok{background:#e5f6eb;padding:12px;border-radius:11px;margin-top:11px}.error{background:#ffe6e9;padding:12px;border-radius:11px;margin-top:11px}.alert{background:#f6faf7;border:1px solid #dde8e1;padding:13px;border-radius:13px;margin:10px 0}.hidden{display:none!important}#qr{display:flex;justify-content:center;margin:18px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header><h2>🐾 HUNDENE VÅRE</h2><div>Eierside – Digital Hunde-ID</div></header>
<main>
<div id="loading" class="card center"><h2>Henter hund …</h2></div>
<div id="missingId" class="card hidden"><h2>⚠️ Hunde-ID ikke funnet</h2></div>

<section id="page" class="hidden">
<div class="card center">
<div id="photoHolder"><div class="placeholder">🐶</div></div>
<h2 id="dogName"></h2><p id="dogInfo" class="muted"></p>
<div id="badge" class="badge safe"></div><p><b>Digital ID:</b> <span id="code"></span></p>
</div>

<div class="card">
<h2>🔐 Eierkontroll</h2>
<label>PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN-koden din">
<button class="red" onclick="setMissing(true)">🚨 MELD HUNDEN SAVNET</button>
<button class="outline" onclick="setMissing(false)">✅ MELD HUNDEN TRYGG</button>
<button class="green" onclick="loadAlerts()">🔔 HENT VARSLER</button>
<button class="outline" onclick="showQR()">▦ VIS QR-KODE</button>
<div id="ownerMsg"></div>
</div>

<div class="card">
<h2>✏️ Rediger hundens profil</h2>
<div class="grid">
<div><label>Navn</label><input id="editName"></div>
<div><label>Rase</label><input id="editBreed"></div>
<div><label>Kjønn</label><select id="editSex"><option value=""></option><option>Tispe</option><option>Hannhund</option></select></div>
<div><label>Farge</label><input id="editColor"></div>
<div class="full"><label>Nytt bilde (valgfritt)</label><input id="editPhoto" type="file" accept="image/*"></div>
</div>
<button class="green" onclick="saveProfile()">💾 LAGRE ENDRINGER</button>
<div id="editMsg"></div>
</div>

<div class="card"><h2>🔔 Funnvarsler</h2><div id="alerts"><p class="muted">Skriv PIN og trykk «Hent varsler».</p></div></div>

<div id="qrCard" class="card center hidden"><h2>QR-kode</h2><div id="qr"></div><p class="muted">Denne QR-koden åpner hundens offentlige finner-side.</p></div>
</section>
</main>

<script>
const sb=supabase.createClient("https://kxudiviidwwwclbzgdyx.supabase.co","sb_publishable_EaSgrgWqXKnaRRRkKparWA_ZmmRG8QH");
const DOG=(new URLSearchParams(location.search).get("id")||"").trim();
let dog=null, newPhotoFile=null;

document.getElementById("editPhoto").addEventListener("change",e=>newPhotoFile=e.target.files?.[0]||null);
function esc(v){const d=document.createElement("div");d.textContent=v||"";return d.innerHTML}
function clean(n){return String(n||"bilde.jpg").replace(/[^a-zA-Z0-9._-]/g,"_")}
function fmt(v){try{return new Date(v).toLocaleString("no-NO")}catch{return v}}

async function loadDog(){
 if(!DOG){fail();return}
 const {data,error}=await sb.rpc("get_dog_public",{p_dog_code:DOG});
 document.getElementById("loading").classList.add("hidden");
 if(error||!data||!data[0]){fail();return}
 dog=data[0];document.getElementById("page").classList.remove("hidden");
 render();
}
function fail(){document.getElementById("loading").classList.add("hidden");document.getElementById("missingId").classList.remove("hidden")}
function render(){
 document.getElementById("dogName").textContent=dog.dog_name+" 🐾";
 document.getElementById("dogInfo").textContent=[dog.breed,dog.sex,dog.color].filter(Boolean).join(" · ");
 document.getElementById("code").textContent=dog.dog_code;
 const b=document.getElementById("badge");b.className="badge "+(dog.is_missing?"missing":"safe");b.textContent=dog.is_missing?"🚨 HUNDEN ER SAVNET":"🟢 HUNDEN ER TRYGG";
 document.getElementById("editName").value=dog.dog_name||"";
 document.getElementById("editBreed").value=dog.breed||"";
 document.getElementById("editSex").value=dog.sex||"";
 document.getElementById("editColor").value=dog.color||"";
 if(dog.photo_url)document.getElementById("photoHolder").innerHTML='<img class="dog" src="'+dog.photo_url+'" alt="Hund">';
}
async function refresh(){const {data}=await sb.rpc("get_dog_public",{p_dog_code:DOG});if(data&&data[0]){dog=data[0];render()}}

async function setMissing(v){
 const pin=document.getElementById("pin").value.trim(),m=document.getElementById("ownerMsg");
 if(!pin){m.innerHTML='<div class="error">Skriv PIN først.</div>';return}
 const {data,error}=await sb.rpc("set_dog_missing",{p_dog_code:DOG,p_owner_pin:pin,p_is_missing:v});
 if(error){m.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}
 if(!data){m.innerHTML='<div class="error">PIN stemmer ikke.</div>';return}
 m.innerHTML='<div class="ok">'+(v?'🚨 Hunden er meldt savnet.':'✅ Hunden er meldt trygg.')+'</div>';await refresh();
}
async function uploadNew(){
 if(!newPhotoFile)return dog.photo_url||"";
 const path="hunde-id/"+DOG+"/"+Date.now()+"-"+clean(newPhotoFile.name);
 const {error}=await sb.storage.from("story-images").upload(path,newPhotoFile);
 if(error)throw new Error(error.message);
 return sb.storage.from("story-images").getPublicUrl(path).data.publicUrl||"";
}
async function saveProfile(){
 const pin=document.getElementById("pin").value.trim(),m=document.getElementById("editMsg");
 if(!pin){m.innerHTML='<div class="error">Skriv PIN i Eierkontroll først.</div>';return}
 try{
  m.innerHTML='<div class="ok">Lagrer …</div>';
  const photo=await uploadNew();
  const {data,error}=await sb.rpc("update_dog_profile",{
   p_dog_code:DOG,p_owner_pin:pin,p_dog_name:document.getElementById("editName").value.trim(),
   p_breed:document.getElementById("editBreed").value.trim(),p_sex:document.getElementById("editSex").value,
   p_color:document.getElementById("editColor").value.trim(),p_photo_url:photo
  });
  if(error)throw new Error(error.message);
  if(!data){m.innerHTML='<div class="error">PIN stemmer ikke.</div>';return}
  m.innerHTML='<div class="ok">✅ Profilen er oppdatert.</div>';newPhotoFile=null;await refresh();
 }catch(e){m.innerHTML='<div class="error">Feil: '+esc(e.message)+'</div>'}
}
async function loadAlerts(){
 const pin=document.getElementById("pin").value.trim(),box=document.getElementById("alerts");
 if(!pin){box.innerHTML='<div class="error">Skriv PIN først.</div>';return}
 const {data,error}=await sb.rpc("get_dog_alerts",{p_dog_code:DOG,p_owner_pin:pin});
 if(error){box.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}
 if(!data||!data.length){box.innerHTML='<p class="muted">Ingen varsler ennå – eller PIN er feil.</p>';return}
 box.innerHTML=data.map(a=>'<div class="alert"><b>🐾 '+esc(dog.dog_name)+' er funnet</b><br><span class="muted">'+fmt(a.created_at)+'</span><br><br>'+
 (a.finder_name?'<b>Finner:</b> '+esc(a.finder_name)+'<br>':'')+(a.finder_phone?'<b>Telefon:</b> '+esc(a.finder_phone)+'<br>':'')+
 (a.message?'<b>Melding:</b> '+esc(a.message)+'<br>':'')+(a.location_url?'<b>📍 <a target="_blank" href="'+encodeURI(a.location_url)+'">Se posisjon</a></b>':'')+'</div>').join("");
}
function showQR(){
 document.getElementById("qrCard").classList.remove("hidden");
 const q=document.getElementById("qr");q.innerHTML="";
 new QRCode(q,{text:"https://www.xn--hundenevre-85a.com/hunde-id.html?id="+encodeURIComponent(DOG),width:220,height:220});
 document.getElementById("qrCard").scrollIntoView({behavior:"smooth"});
}
loadDog();
</script></body></html>
