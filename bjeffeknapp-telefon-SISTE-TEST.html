<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bjeffeknapp frekvenstest</title><style>*{box-sizing:border-box}body{margin:0;background:#102033;color:#fff;font-family:Arial,sans-serif}.w{max-width:650px;margin:auto;padding:15px}.c{background:white;color:#142235;padding:18px;border-radius:22px}h1{text-align:center}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:18px 6px;border:0;border-radius:15px;font-size:18px;font-weight:bold}.f{background:#eaf2fb;color:#123d68}.ctl{width:100%;background:#1976d2;color:white;margin-bottom:10px}.sw{grid-column:1/-1;background:#ffb020}.stop{width:100%;background:#d92d20;color:white;margin-top:10px}.s{text-align:center;font-weight:bold;margin:14px}.n{background:#f3f6f8;padding:13px;border-radius:12px;line-height:1.4}</style></head><body><div class="w"><div class="c"><h1>🐕 Bjeffeknapp TEST</h1><p style="text-align:center">Finn frekvensen hunden reagerer tydeligst på</p><button class="ctl" onclick="tone(5000)">🔈 KONTROLL 5 kHz – denne skal du høre</button><div class="g"><button class="f" onclick="tone(15000)">15 kHz</button><button class="f" onclick="tone(16000)">16 kHz</button><button class="f" onclick="tone(17000)">17 kHz</button><button class="f" onclick="tone(18000)">18 kHz</button><button class="f" onclick="tone(19000)">19 kHz</button><button class="f" onclick="tone(19500)">19,5 kHz</button><button class="f" onclick="tone(20000)">20 kHz</button><button class="sw" onclick="sweep()">↗️ 15–20 kHz SVEIP</button></div><button class="stop" onclick="stop()">⏹ STOPP LYD</button><div class="s" id="s">Klar til test</div><div class="n"><b>Test enkelt:</b> Vent til hunden bjeffer naturlig. Trykk én gang på én frekvens. Se om hunden stopper, snur hodet eller søker etter lyden. Bruk korte signaler og stopp dersom hunden virker redd eller stresset.</div></div></div><script>let c,o,g,t;function ac(){if(!c)c=new(AudioContext||webkitAudioContext)();if(c.state==="suspended")c.resume();return c}function stop(){if(t)clearTimeout(t);if(o){try{o.stop()}catch(e){}o=null}document.getElementById("s").textContent="Stoppet"}function begin(f){stop();let x=ac();o=x.createOscillator();g=x.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(x.destination);o.start();return x}function tone(f){begin(f);document.getElementById("s").textContent=(f/1000).toString().replace(".",",")+" kHz";t=setTimeout(stop,1400)}function sweep(){let x=begin(15000);o.frequency.exponentialRampToValueAtTime(20000,x.currentTime+1.35);document.getElementById("s").textContent="15–20 kHz sveip";t=setTimeout(stop,1400)}</script></body></html>
